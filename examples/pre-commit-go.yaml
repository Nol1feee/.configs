default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: openapi-regen
        name: OpenAPI regen
        entry: make api-regen
        language: system
        pass_filenames: false

      - id: openapi-lint
        name: OpenAPI lint
        entry: make api-lint
        language: system
        files: ^api/openapi/.*\.ya?ml$
        pass_filenames: false

      - id: openapi-breaking
        name: OpenAPI breaking changes
        entry: make api-breaking
        language: system
        files: ^api/openapi/.*\.ya?ml$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: make lint
        language: system
        files: \.go$
        pass_filenames: false

      - id: gci
        name: gci
        entry: make gci-fix
        language: system
        files: \.go$
        pass_filenames: false

      - id: go-test
        name: Go tests
        entry: go test ./...
        language: system
        files: \.go$
        pass_filenames: false
